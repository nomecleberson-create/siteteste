services:
  - type: web
    name: playlist-downloader-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: MAX_PLAYLIST_ITEMS
        value: "100"
